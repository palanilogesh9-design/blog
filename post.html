<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo"><a href="index.html">MyBlog</a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <article class="post-article">
            <header class="post-header">
                <h1 id="postTitle"></h1>
                <div class="post-meta">
                    <span class="post-date" id="postDate"></span>
                    <span class="post-category" id="postCategory"></span>
                </div>
            </header>

            <img id="postImage" src="" alt="" class="post-featured-image" style="display: none; margin: 2rem 0; width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px;">

            <div id="postContent" class="post-content"></div>

            <footer class="post-footer">
                <div class="tags" id="postTags"></div>
            </footer>
        </article>

        <nav class="post-navigation">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </nav>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 My Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
