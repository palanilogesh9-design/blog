<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - Thoughts & Stories</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo"><a href="index.html">MyBlog</a></div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container hero-content">
            <h1>Welcome to My Blog</h1>
            <p>Thoughts, stories, and insights on technology, design, and life</p>
        </div>
    </header>

    <main class="container">
        <section class="blog-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search posts..." class="search-input">
            </div>
            <div class="filters">
                <select id="categoryFilter" class="category-select">
                    <option value="">All Categories</option>
                </select>
            </div>
        </section>

        <section class="blog-grid">
            <div id="postsContainer" class="posts-container">
                <!-- Posts will be loaded here by JavaScript -->
            </div>
        </section>

        <div id="noResults" class="no-results" style="display: none;">
            <p>No posts found matching your search or filter.</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 My Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
